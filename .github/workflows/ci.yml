name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check final audio encoding
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/verify-final-audio-ffmpeg.mjs
      - run: npm run build
      - run: docker build --pull=false -t matter-lab-web:ci .
  native-compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -typecheck -module-cache-path "$RUNNER_TEMP/matter-lab-swift" scripts/render-native.swift
