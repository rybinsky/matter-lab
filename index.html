<!doctype html>
<html lang="ru" data-app-state="loading" data-boot-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111214" />
    <meta name="description" content="Локальная лаборатория физических экспериментов и видео" />
    <title>Matter Lab — физическая лаборатория</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23263332'/%3E%3Cpath d='M12 33V15l12 12 12-12v18' fill='none' stroke='%23ea8661' stroke-width='5'/%3E%3C/svg%3E" />
    <style>
      html{background:#111214;--boot-page:#111214;--boot-panel:#1a1c20;--boot-control:#25282e;--boot-ink:#f4f5f7;--boot-muted:#7c8593;--boot-accent:#ff865e;color-scheme:dark}
      html[data-boot-theme=light]{background:#e9eaec;--boot-page:#e9eaec;--boot-panel:#fafafb;--boot-control:#eff0f2;--boot-ink:#202329;--boot-muted:#626b78;--boot-accent:#f2764f;color-scheme:light}
      body{margin:0}
      /* Keep layout measurable while every unfinished app node stays unpainted. */
      html:not([data-app-state=ready]) body>:not(#app-bootstrap):not(script):not(noscript),
      html:not([data-app-state=ready]) body>:not(#app-bootstrap):not(script):not(noscript) *{visibility:hidden!important;pointer-events:none!important}
      #app-bootstrap{position:fixed;inset:0;z-index:2147483647;display:grid;grid-template-rows:78px minmax(0,1fr);background:var(--boot-page);color:var(--boot-ink);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
      #app-bootstrap *{box-sizing:border-box}
      #app-bootstrap .boot-header{display:flex;align-items:center;gap:11px;padding:0 22px}
      #app-bootstrap .boot-mark{display:grid;place-items:center;width:33px;height:33px;background:var(--boot-accent);border-radius:9px;color:#20110c}
      #app-bootstrap .boot-mark svg{width:20px;height:20px}
      #app-bootstrap .boot-brand{font-size:19px;font-weight:650;letter-spacing:-.9px}
      #app-bootstrap .boot-brand span{color:var(--boot-muted)}
      #app-bootstrap .boot-header-line{height:10px;width:124px;margin-left:26px;background:var(--boot-control);border-radius:4px}
      #app-bootstrap .boot-layout{display:grid;grid-template-columns:88px 224px minmax(0,1fr) 272px;min-height:0;padding:10px 12px 12px 0}
      #app-bootstrap .boot-rail{display:grid;align-content:start;justify-items:center;gap:17px;padding:16px 8px}
      #app-bootstrap .boot-rail span{width:29px;height:29px;background:var(--boot-control);border-radius:7px}
      #app-bootstrap .boot-library,#app-bootstrap .boot-inspector{background:var(--boot-panel);padding:22px 17px}
      #app-bootstrap .boot-library{border-radius:12px 0 0 12px;border-right:1px solid var(--boot-control)}
      #app-bootstrap .boot-inspector{border-radius:0 12px 12px 0;border-left:1px solid var(--boot-control)}
      #app-bootstrap .boot-line{height:9px;width:65%;background:var(--boot-control);border-radius:4px;margin-bottom:18px}
      #app-bootstrap .boot-line.short{width:40%}
      #app-bootstrap .boot-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:27px}
      #app-bootstrap .boot-tiles span{height:90px;border-radius:8px;background:var(--boot-control);opacity:.58}
      #app-bootstrap .boot-field{height:32px;background:var(--boot-control);border-radius:6px;margin:9px 0 24px;opacity:.7}
      #app-bootstrap .boot-stage{display:flex;flex-direction:column;min-width:0;background:var(--boot-panel)}
      #app-bootstrap .boot-stage-bar{display:flex;gap:9px;align-items:center;min-height:56px;padding:0 22px}
      #app-bootstrap .boot-stage-bar span{height:8px;width:65px;border-radius:3px;background:var(--boot-control)}
      #app-bootstrap .boot-space{position:relative;display:grid;place-items:center;flex:1;margin:0 12px 12px;border-radius:7px;background:var(--boot-page)}
      #app-bootstrap .boot-loading{display:flex;align-items:center;gap:10px;color:var(--boot-muted);font-size:12px}
      #app-bootstrap .boot-dot{width:6px;height:6px;border-radius:50%;background:var(--boot-accent);animation:boot-pulse 1.25s ease-in-out infinite}
      #app-bootstrap .boot-error,#app-bootstrap .boot-nojs{display:none;max-width:360px;margin:24px;padding:26px;line-height:1.7}
      #app-bootstrap h1{font-size:19px;letter-spacing:-.3px;line-height:1.4;font-weight:550;margin:0 0 12px}
      #app-bootstrap p{font-size:13px;color:var(--boot-muted);margin:0 0 18px}
      #app-bootstrap .boot-retry{display:inline-flex;align-items:center;min-height:37px;padding:8px 14px;border-radius:6px;background:var(--boot-accent);color:#20110c;text-decoration:none;font-size:12px;font-weight:600}
      #app-bootstrap .boot-retry:focus-visible{outline:2px solid var(--boot-ink);outline-offset:4px}
      html[data-app-state=error] #app-bootstrap .boot-loading{display:none}
      html[data-app-state=error] #app-bootstrap .boot-error{display:block}
      html[data-app-state=ready] #app-bootstrap{display:none}
      @keyframes boot-pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){#app-bootstrap .boot-dot{animation:none}}
      @media(max-width:1350px){#app-bootstrap .boot-layout{grid-template-columns:88px minmax(0,1fr) 272px}#app-bootstrap .boot-library{display:none}}
      @media(max-width:760px){#app-bootstrap{grid-template-rows:62px minmax(0,1fr)}#app-bootstrap .boot-header{padding:0 14px}#app-bootstrap .boot-header-line{display:none}#app-bootstrap .boot-layout{grid-template-columns:64px minmax(0,1fr);padding:0 8px 8px 0}#app-bootstrap .boot-inspector{display:none}#app-bootstrap .boot-stage{border-radius:10px}#app-bootstrap .boot-rail{padding-top:18px}#app-bootstrap .boot-error,#app-bootstrap .boot-nojs{padding:12px;margin:16px}}
    </style>
    <script>
      // This listener is in the document, so even an unavailable entry bundle
      // can expose the static retry screen in both dev and built releases.
      window.addEventListener('error', function(event) {
        if (document.documentElement.dataset.appState !== 'ready' &&
            (event.target === window || event.target?.tagName === 'SCRIPT')) {
          document.documentElement.dataset.appState = 'error';
        }
      }, true);
      try {
        if (localStorage.getItem('matter-lab-appearance') === 'light') {
          document.documentElement.dataset.bootTheme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#e9eaec';
        }
      } catch {}
    </script>
    <noscript><style>#app-bootstrap .boot-loading{display:none}#app-bootstrap .boot-nojs{display:block}</style></noscript>
  </head>
  <body>
    <div id="app" inert aria-hidden="true" aria-busy="true"></div>
    <div id="app-bootstrap" aria-label="Открытие Matter Lab">
      <div class="boot-header" aria-hidden="true"><span class="boot-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6l8 8 8-8v12" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></span><span class="boot-brand">matter<span>lab</span></span><span class="boot-header-line"></span></div>
      <div class="boot-layout">
        <div class="boot-rail" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="boot-library" aria-hidden="true"><div class="boot-line"></div><div class="boot-line short"></div><div class="boot-tiles"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
        <div class="boot-stage"><div class="boot-stage-bar" aria-hidden="true"><span></span><span></span></div><div class="boot-space">
          <div class="boot-loading" role="status"><span class="boot-dot" aria-hidden="true"></span>Открываем студию…</div>
          <section class="boot-error" role="alert"><h1>Не удалось открыть студию</h1><p>Попробуйте обновить страницу. Сохранённые проекты останутся на месте.</p><a class="boot-retry" id="boot-retry" href="">Попробовать снова</a></section>
          <noscript><section class="boot-nojs"><h1>Включите JavaScript</h1><p>Он нужен для сцены, физики и инструментов студии. Включите JavaScript в браузере и обновите страницу.</p><a class="boot-retry" href="">Обновить страницу</a></section></noscript>
        </div></div>
        <div class="boot-inspector" aria-hidden="true"><div class="boot-line"></div><div class="boot-field"></div><div class="boot-line short"></div><div class="boot-field"></div><div class="boot-line"></div><div class="boot-field"></div></div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
